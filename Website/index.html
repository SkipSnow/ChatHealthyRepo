<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ChatHealthy.ai &mdash; Maintenance</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2937;
      --muted: #4b5563;
      --brand: #0f766e;
      --brand-accent: #e26d5c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    /* Brand lockup in the top-left corner */
    .brand-lockup {
      position: fixed;
      top: 1.25rem;
      left: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
    }
    .brand-lockup .brand-mark {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      border-radius: 50%;
      color: #ffffff;
    }
    .brand-lockup .brand-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--brand);
      letter-spacing: 0.01em;
    }
    .brand-lockup .brand-name .brand-tld { font-weight: 500; }
    .brand-lockup .brand-tag {
      font-size: 0.85rem;
      color: var(--brand-accent);
      font-style: italic;
      margin-left: 0.25rem;
    }
    .container { max-width: 520px; }
    .icon { margin: 0 auto 2rem; width: 220px; height: 220px; }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      margin: 0 0 0.75rem;
      letter-spacing: -0.01em;
    }
    p {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--muted);
      margin: 0.25rem 0;
    }
  </style>
</head>
<body>
  <div class="brand-lockup" aria-label="ChatHealthy.ai Pre-Alpha">
    <span class="brand-mark" aria-hidden="true">
      <!-- White plus/health cross inside the green disc -->
      <svg width="18" height="18" viewBox="0 0 24 24" role="img" aria-label="plus">
        <path d="M10 4 h4 v6 h6 v4 h-6 v6 h-4 v-6 h-6 v-4 h6 z"
              fill="#ffffff"/>
      </svg>
    </span>
    <span class="brand-name">ChatHealthy<span class="brand-tld">.ai</span></span>
    <span class="brand-tag">Pre-Alpha</span>
  </div>

  <main class="container">
    <!-- Hard hat icon (inline SVG for reliable rendering) -->
    <svg class="icon" viewBox="0 0 240 240" role="img" aria-label="Under construction">
      <path d="M40 160 Q40 60 120 60 Q200 60 200 160 Z"
            fill="#f59e0b" stroke="#78350f" stroke-width="3"/>
      <rect x="20" y="150" width="200" height="24" rx="10"
            fill="#d97706" stroke="#78350f" stroke-width="3"/>
      <path d="M120 60 L120 160" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M80 68 Q120 130 160 68" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M55 100 Q120 135 185 100" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
      <path d="M65 100 Q80 75 105 68" stroke="#fde68a" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
    </svg>
    <h1>Paused for maintenance</h1>
    <p>Be back soon.</p>
  </main>
</body>
</html>
