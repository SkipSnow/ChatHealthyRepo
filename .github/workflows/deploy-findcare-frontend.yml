name: Deploy FindCare Frontend to Cloudflare Pages

on:
  push:
    branches: [dev]
    paths:
      - 'Code/ConversationalUX/FindCareChat/frontend/**'
      - '.github/workflows/deploy-findcare-frontend.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: Code/ConversationalUX/FindCareChat/frontend
        run: npm ci

      - name: Build
        working-directory: Code/ConversationalUX/FindCareChat/frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.FINDCARE_API_URL_DEV }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Code/ConversationalUX/FindCareChat/frontend/dist --project-name=chathealthy-dev --branch=dev

