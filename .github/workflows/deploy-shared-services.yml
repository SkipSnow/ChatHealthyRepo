name: Deploy Shared Services to HuggingFace
'on':
  workflow_dispatch: null
  push:
    branches:
    - dev
    - qa
    - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Derive Space name and env from branch
      id: space
      run: "BRANCH=\"${GITHUB_REF_NAME}\"\nORG=\"SkipSnow\"\nBASE=\"SharedServicesSpace\"\nif [ \"$BRANCH\" = \"main\" ]; then\n  SPACE=\"${BASE}\"\n  ENV=\"prod\"\nelse\n  SPACE=\"${BRANCH}_${BASE}\"\n  ENV=\"${BRANCH}\"\nfi\necho \"name=${SPACE}\" >> $GITHUB_OUTPUT\necho \"env=${ENV}\" >> $GITHUB_OUTPUT\necho \"Deploying to: ${ORG}/${SPACE} (env=${ENV})\"\n"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Set HF Space variables + secrets (peer URLs, env, certs, signing key)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE: ${{ steps.space.outputs.name }}
        ENV: ${{ steps.space.outputs.env }}
        SHARED_SIGNING_KEY_B64: ${{ secrets.SHARED_SIGNING_KEY_B64 }}
      run: "if [ \"$ENV\" = \"prod\" ]; then PREFIX=\"\"; else PREFIX=\"${ENV}-\"; fi\nFINDCARE_URL=\"https://skipsnow-${PREFIX}chathealthyspace.hf.space\"\nEVALCARE_URL=\"https://skipsnow-${PREFIX}evaluatecarespace.hf.space\"\nset_var() {\n  K=\"$1\"; V=\"$2\"\n  curl -s -X DELETE \"https://huggingface.co/api/spaces/SkipSnow/${HF_SPACE}/secrets\" \\\n    -H \"Authorization: Bearer $HF_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\\\"key\\\":\\\"${K}\\\"}\" -o /dev/null\n  curl -sf -X POST \"https://huggingface.co/api/spaces/SkipSnow/${HF_SPACE}/variables\" \\\n    -H \"Authorization: Bearer $HF_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\\\"key\\\":\\\"${K}\\\",\\\"value\\\":\\\"${V}\\\",\\\"description\\\":\\\"Set by deploy workflow\\\"}\" \\\n    -o /dev/null && echo \"  set var ${K}\"\n}\nset_secret() {\n  # MUST delete same-named variable + same-named secret before POST\n  # — HF rejects var/secret collision and rejects POST-on-existing.\n  # JSON body via python -c to immunize against shell quoting.\n  K=\"$1\"; V=\"$2\"\n  curl -s -X DELETE \"https://huggingface.co/api/spaces/SkipSnow/${HF_SPACE}/variables\" \\\n    -H \"Authorization: Bearer $HF_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\\\"key\\\":\\\"${K}\\\"}\" -o /dev/null\n  curl -s -X DELETE \"https://huggingface.co/api/spaces/SkipSnow/${HF_SPACE}/secrets\" \\\n    -H \"Authorization: Bearer $HF_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\\\"key\\\":\\\"${K}\\\"}\" -o /dev/null\n  BODY=$(python3 -c \"import json,sys; print(json.dumps({'key':sys.argv[1],'value':sys.argv[2],'description':'Set by deploy workflow'}))\" \"$K\" \"$V\")\n  HTTP=$(curl -s -X POST \"https://huggingface.co/api/spaces/SkipSnow/${HF_SPACE}/secrets\" \\\n    -H \"Authorization: Bearer $HF_TOKEN\" \\\n    -H \"Content-Type: application/json\" \\\n    --data \"$BODY\" \\\n    -o /tmp/hf_resp.txt -w \"%{http_code}\")\n  if [ \"$HTTP\" = \"200\" ] || [ \"$HTTP\" = \"201\" ]; then\n    echo \"  set secret ${K} (http=$HTTP)\"\n  else\n    echo \"  ERROR set secret ${K}: http=$HTTP\"\n    cat /tmp/hf_resp.txt; echo\n    return 1\n  fi\n}\nset_var \"ENV_PREFIX\"     \"${ENV}\"\nset_var \"FINDCARE_URL\"   \"${FINDCARE_URL}\"\nset_var \"EVALCARE_URL\"   \"${EVALCARE_URL}\"\nset_var \"FINDCARE_INTERNAL_URL\" \"${FINDCARE_URL}\"\n\n# Public certs for token-level mutual auth (per SharedServices'\n# app.py _bootstrap_certs_from_env, lines 33-36):\n#   FINDCARE_CERT_PEM      peer (verifies FindCare-signed tokens)\n#   SHARED_CERT_PEM        own\n#   CA_CERT_PEM            chain\n# All public — read from repo, base64, ship as variables.\nFINDCARE_CERT_PEM_B64=$(base64 -w 0 Code/Shared/ops/certs/findcare.crt)\nSHARED_CERT_PEM_B64=$(base64 -w 0 Code/Shared/ops/certs/shared.crt)\nCA_CERT_PEM_B64=$(base64 -w 0 Code/Shared/ops/certs/ca.crt)\nset_var \"FINDCARE_CERT_PEM\" \"${FINDCARE_CERT_PEM_B64}\"\nset_var \"SHARED_CERT_PEM\"   \"${SHARED_CERT_PEM_B64}\"\nset_var \"CA_CERT_PEM\"       \"${CA_CERT_PEM_B64}\"\n\n# Private signing key — secret, sourced from GH repo secret.\nif [ -z \"$SHARED_SIGNING_KEY_B64\" ]; then\n  echo \"ERROR: GH repo secret SHARED_SIGNING_KEY_B64 is empty or unset.\"\n  echo \"Create it at https://github.com/SkipSnow/ChatHealthyRepo/settings/secrets/actions\"\n  echo \"Value: base64 -w0 of Code/Shared/ops/certs/shared.key\"\n  exit 1\nfi\nset_secret \"SHARED_SIGNING_KEY_PEM\" \"${SHARED_SIGNING_KEY_B64}\"\n"
    - name: Push to HuggingFace Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE: ${{ steps.space.outputs.name }}
      run: "git config --global user.email \"skip.snow@gmail.com\"\ngit config --global user.name \"SkipSnow\"\n\necho \"Target Space: SkipSnow/${HF_SPACE}\"\ngit clone https://SkipSnow:$HF_TOKEN@huggingface.co/spaces/SkipSnow/${HF_SPACE} hf_space\n\n# Preserve README.md (HF config)\ncp hf_space/README.md /tmp/hf_readme.md 2>/dev/null || true\nfind hf_space -mindepth 1 -not -path 'hf_space/.git*' -delete\ncp /tmp/hf_readme.md hf_space/README.md 2>/dev/null || true\n\n# Mirror sharedServices/Code/ flat into hf_space/. Same layout as\n# the Dockerfile produces inside the container — single set of\n# import statements works in both environments.\nrsync -av \\\n  --exclude='.env' \\\n  --exclude='__pycache__' \\\n  --exclude='*.pyc' \\\n  sharedServices/Code/ hf_space/\n\n# EPIC-003: bring FrontEndApplicationLib into the build context so the\n# Dockerfile can pip-install chathealthy-frontend-lib from a local path.\nmkdir -p hf_space/FrontEndApplicationLib\nrsync -av \\\n  --exclude='__pycache__' \\\n  --exclude='*.pyc' \\\n  FrontEndApplicationLib/ hf_space/FrontEndApplicationLib/\n\n\n# EPIC-002-F-003: bring architecture/AuthorizationsAndAuthentications/\n# files into the build context as `authentication/` so the Dockerfile's\n# `COPY authentication /app/authentication` finds them. The auth feature\n# lives in its own architecture/ dir per the feature-mirroring layout\n# (Skip 2026-05-14) and is staged in by the substrate at build time.\nmkdir -p hf_space/authentication\nrsync -av \\\n  --exclude='__pycache__' \\\n  --exclude='*.pyc' \\\n  --exclude='ArchitectureDesignAndAuditDocs' \\\n  architecture/AuthorizationsAndAuthentications/ hf_space/authentication/\n\n# Bake build_info.json into the image so /health reports the truth.\nBUILD=$(git rev-list --count HEAD)\nCOMMIT=$(git rev-parse --short HEAD)\nBUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)\ncat > hf_space/build_info.json <<EOF\n{\n  \"build\": $BUILD,\n  \"commit\": \"$COMMIT\",\n  \"env\": \"$ENV\",\n  \"service\": \"shared_services\",\n  \"version\": \"1.4.1\",\n  \"framework\": \"0.1.5\",\n  \"built_at\": \"$BUILT_AT\"\n}\nEOF\ncd hf_space\ngit add .\nif git diff --staged --quiet; then\n  echo \"No changes to deploy.\"\nelse\n  git commit -m \"Deploy from GitHub commit ${{ github.sha }}\"\n  git push\n  echo \"Deployed successfully.\"\nfi\n"
