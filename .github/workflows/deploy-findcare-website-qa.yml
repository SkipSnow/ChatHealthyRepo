name: Deploy FindCare Website (QA)
'on':
  workflow_dispatch: null
  push:
    branches:
    - qa
    paths:
    - Website/**
    - .github/workflows/deploy-findcare-website-qa.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Create Pages project (idempotent)
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_ACCOUN_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages project create chathealthy-website-qa --production-branch qa
      continue-on-error: true
    - name: Deploy to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_ACCOUN_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy Website --project-name=chathealthy-website-qa --branch=qa
    - name: Poll backend health before smoke
      run: "for URL in \\\n    \"https://skipsnow-qa-chathealthyspace.hf.space\" \\\n    \"https://skipsnow-qa-evaluatecarespace.hf.space\" \\\n    \"https://skipsnow-qa-sharedservicesspace.hf.space\"; do\n  echo \"Polling ${URL}/health...\"\n  for i in $(seq 1 30); do\n    HTTP_CODE=$(curl -s -o /tmp/h.json -w \"%{http_code}\" -X POST \"${URL}/health\" -m 8)\n    if [ \"$HTTP_CODE\" = \"200\" ]; then\n      echo \"  ${URL}/health 200 (poll $i)\"\n      break\n    fi\n    echo \"  poll $i/30: http=$HTTP_CODE\"\n    if [ $i -eq 30 ]; then\n      echo \"TIMED OUT waiting for ${URL}/health (last: $HTTP_CODE)\"\n      cat /tmp/h.json\n      exit 1\n    fi\n    sleep 10\n  done\ndone\n"
    - name: Install smoke test dependencies
      run: 'pip install --quiet pytest pytest-playwright httpx cryptography psutil python-dotenv jsonschema anyio

        playwright install --with-deps chromium

        '
    - name: Run master smoke test against deployed env
      env:
        SMOKE_TEST_ENV: qa
        CHATHEALTHY_PROJECT_ROOT: ${{ github.workspace }}
      run: '# Smoke runs against the env we just deployed to. No deselects,

        # no marker filters per "100% comply" directive (2026-05-04).

        python -m pytest architecture/DevOpsBuildDeployAndEnvironmentManagement/localSmokeTestPyTest.py -v

        '
