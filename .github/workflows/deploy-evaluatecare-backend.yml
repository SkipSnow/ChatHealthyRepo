name: Deploy EvaluateCare Backend to HuggingFace

on:
  push:
    branches:
      - dev
      - qa
      - main
    paths:
      - 'Code/evaluate_care/**'
      - 'Code/Shared/session_token.py'
      - '.github/workflows/deploy-evaluatecare-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Derive Space name and env from branch
        id: space
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          ORG="SkipSnow"
          BASE="EvaluateCareSpace"
          if [ "$BRANCH" = "main" ]; then
            SPACE="${BASE}"
            ENV="prod"
          else
            SPACE="${BRANCH}_${BASE}"
            ENV="${BRANCH}"
          fi
          echo "name=${SPACE}" >> $GITHUB_OUTPUT
          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${ORG}/${SPACE} (env=${ENV})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-deploy rule check (v4-017)
        run: |
          pip install pymongo python-dotenv
          python Code/Shared/ops/tools/pre_deploy_rule_check.py evaluatecare

      - name: Bump build counter
        env:
          MONGO_FRONTEND_connectionString: ${{ secrets.MONGO_FRONTEND_connectionString }}
        run: |
          python Code/Shared/ops/bump_build.py --env ${{ steps.space.outputs.env }}

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ steps.space.outputs.name }}
        run: |
          git config --global user.email "skip.snow@gmail.com"
          git config --global user.name "SkipSnow"

          echo "Target Space: SkipSnow/${HF_SPACE}"
          git clone https://SkipSnow:$HF_TOKEN@huggingface.co/spaces/SkipSnow/${HF_SPACE} hf_space

          # Preserve README.md (HF config)
          cp hf_space/README.md /tmp/hf_readme.md 2>/dev/null || true
          find hf_space -mindepth 1 -not -path 'hf_space/.git*' -delete
          cp /tmp/hf_readme.md hf_space/README.md 2>/dev/null || true

          # EvaluateCare — app.py at root, evaluate_care/ as package
          cp Code/evaluate_care/app.py hf_space/
          cp Code/evaluate_care/Dockerfile hf_space/
          cp Code/evaluate_care/requirements.txt hf_space/
          mkdir -p hf_space/evaluate_care
          rsync -av \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='tests/' \
            --exclude='app.py' \
            --exclude='Dockerfile' \
            --exclude='requirements.txt' \
            Code/evaluate_care/ hf_space/evaluate_care/

          # Shared utilities
          mkdir -p hf_space/shared
          cp Code/Shared/session_token.py hf_space/shared/ 2>/dev/null || true

          # PKI certs deferred to Beta (BUG-SEC-002) — HF doesn't support mTLS

          cd hf_space
          git add .
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy from GitHub commit ${{ github.sha }}"
            git push
            echo "Deployed successfully."
          fi
