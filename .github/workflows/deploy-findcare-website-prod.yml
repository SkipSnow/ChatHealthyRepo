name: Deploy FindCare Website (Prod)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Website/**'
      - '.github/workflows/deploy-findcare-website-prod.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Build-counter bump removed per Rule-063 + BUG-001:
      # the build is now incremented by a post-commit engineering rule on
      # every non-deploy commit, and deploys do NOT bump.

      - name: Create Pages project (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ACCOUN_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create chathealthywebsite --production-branch main
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_ACCOUN_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Website --project-name=chathealthywebsite --branch=main
