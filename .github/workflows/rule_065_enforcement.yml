# Rule-065, enforced where the committer cannot switch it off.
#
# The local hooks are advisory by construction: `git commit --no-verify`
# does not run them, and neither does deleting .git/hooks, repointing
# core.hooksPath, or committing from another clone. This runs the same
# driver against what was pushed, so a commit that skipped the hooks still
# answers for itself before it can land on dev.
#
# It invokes commit_governance_driver.py — the component the hooks invoke —
# rather than reimplementing any rule. There is one statement of what the
# rules are.

name: Rule-065 commit governance

on:
  push:
    branches: [dev]

# dev only. A commit is authored on local and enters at local -> dev, where
# it is authorized. qa and main receive code by promote, which moves a branch
# pointer and creates no commit -- judging one there would re-judge a commit
# already authorized on the way in.

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit and its parent
        uses: actions/checkout@v4
        with:
          # The driver judges a change set. Two commits is enough to name
          # what this push added; a shallow clone of one is not.
          fetch-depth: 2

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies the static enforcements need
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema python-dotenv

      - name: Stage the pushed change set for the driver
        run: |
          # The driver reads the staged set, because that is what a commit
          # publishes. Re-stage what this push changed so it judges exactly
          # the same files the hook would have.
          git reset --soft HEAD~1 || true
          git status --porcelain

      - name: Rule-065, on what this push changed
        run: python architecture/EngineeringRuleEnforcement/code/commit_governance_driver.py

      # The staged set cannot answer for the repository. A file committed
      # before a rule existed is never handed to it, so it is never judged by
      # it -- which is how this framework's own files came to violate rules it
      # exists to enforce while every gate passed them. The sweep hands the
      # driver the whole baseline instead.
      #
      # It runs here rather than at the commit gate because 708 files take
      # forty seconds against seven enforcements, and a developer pays that on
      # every commit while a runner pays it once per push.
      #
      # continue-on-error while the backlog it reports is open: the sweep's
      # job today is to state the number, not to stop work on it. Removing
      # that line is what makes the repository-wide result binding, and is an
      # operator decision, not a mechanical one.
      - name: Rule-065, across the whole repository
        continue-on-error: true
        run: |
          python - <<'PY' > /tmp/baseline.txt
          import sys
          sys.path.insert(0, "architecture/EngineeringRuleEnforcement/code")
          from pathlib import Path
          from baseline_walk import baseline_files
          print("\n".join(baseline_files(Path(".").resolve())))
          PY
          python architecture/EngineeringRuleEnforcement/code/commit_governance_driver.py \
            --files-from /tmp/baseline.txt

      - name: The verdict, in full
        if: always()
        run: |
          # The local run reports "driver returned 1" and says no more; the
          # reason lives in the audit log. Print it, so a failure here names
          # the file and the enforcement rather than sending someone to go
          # and find them.
          tail -n 1 architecture/EngineeringRuleEnforcement/ArchitectureDesignAndAuditDocs/commit_governance.log || true
