name: Deploy FindCare Website (Dev)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'Website/**'
      - '.github/workflows/deploy-findcare-website-dev.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-deploy rule check (v4-017)
        run: |
          pip install pymongo python-dotenv
          python Code/Shared/ops/tools/pre_deploy_rule_check.py website

      - name: Bump build counter
        env:
          MONGO_FRONTEND_connectionString: ${{ secrets.MONGO_FRONTEND_connectionString }}
        run: |
          pip install pymongo python-dotenv
          python Code/Shared/ops/bump_build.py --env dev

      - name: Create Pages project (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create chathealthy-website-dev --production-branch dev
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy Website --project-name=chathealthy-website-dev --branch=dev
