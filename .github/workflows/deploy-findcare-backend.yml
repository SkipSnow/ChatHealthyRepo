name: Deploy ChatHealthy Backend to HuggingFace

on:
  push:
    branches:
      - dev
      - qa
      - main
    paths:
      - 'Code/ConversationalUX/FindCareChat/backend/**'
      - 'Code/ConversationalUX/FindCareChat/frontend/**'
      - 'Code/ConversationalUX/ChatHealthyWhoAmIChat/me/**'
      - 'Code/Shared/ChatHealthyMongoUtilities.py'
      - 'Code/Shared/prompt_system_maker.py'
      - 'brain/machine_artifacts/content/emergency_keywords.json'
      - '.github/workflows/deploy-findcare-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Derive Space name and env from branch
        id: space
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          ORG="SkipSnow"
          BASE="ChatHealthySpace"
          if [ "$BRANCH" = "main" ]; then
            SPACE="${BASE}"
            ENV="prod"
          else
            SPACE="${BRANCH}_${BASE}"
            ENV="${BRANCH}"
          fi
          echo "name=${SPACE}" >> $GITHUB_OUTPUT
          echo "env=${ENV}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${ORG}/${SPACE} (env=${ENV})"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pre-deploy rule check (v4-017)
        run: |
          pip install pymongo python-dotenv
          python Code/Shared/ops/tools/pre_deploy_rule_check.py findcare

      - name: Bump build counter
        env:
          MONGO_FRONTEND_connectionString: ${{ secrets.MONGO_FRONTEND_connectionString }}
        run: |
          pip install pymongo python-dotenv
          python Code/Shared/ops/bump_build.py --env ${{ steps.space.outputs.env }}

      - name: Build React frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build frontend
        working-directory: Code/ConversationalUX/FindCareChat/frontend
        run: |
          npm ci
          VITE_API_URL="" npm run build

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ steps.space.outputs.name }}
        run: |
          git config --global user.email "skip.snow@gmail.com"
          git config --global user.name "SkipSnow"
          git lfs install

          echo "Target Space: SkipSnow/${HF_SPACE}"
          git clone https://SkipSnow:$HF_TOKEN@huggingface.co/spaces/SkipSnow/${HF_SPACE} hf_space

          find hf_space -mindepth 1 -not -path 'hf_space/.git*' -delete

          # Backend code
          rsync -av \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            Code/ConversationalUX/FindCareChat/backend/ hf_space/

          # Pre-built React frontend → static/
          cp -r Code/ConversationalUX/FindCareChat/frontend/dist hf_space/static

          # Shared utilities
          cp Code/Shared/ChatHealthyMongoUtilities.py hf_space/
          cp Code/Shared/prompt_system_maker.py hf_space/
          cp Code/Shared/session_token.py hf_space/

          # PKI certs deferred to Beta (BUG-SEC-002) — HF doesn't support mTLS
          # Session token signing uses unsigned fallback on HF until Beta

          # Brain artifacts needed at runtime
          mkdir -p hf_space/brain/machine_artifacts/content
          cp brain/machine_artifacts/content/emergency_keywords.json hf_space/brain/machine_artifacts/content/
          cp brain/machine_artifacts/content/version.json hf_space/brain/machine_artifacts/content/

          # UAT report tool
          mkdir -p hf_space/ops
          cp Code/Shared/ops/uat_report.py hf_space/ops/

          # me/ context files (PDFs, summary, codebase)
          mkdir -p hf_space/me
          rsync -av Code/ConversationalUX/ChatHealthyWhoAmIChat/me/ hf_space/me/

          cd hf_space
          git lfs track "*.pdf"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy from GitHub commit ${{ github.sha }}"
            git push
            echo "Deployed successfully."
          fi
