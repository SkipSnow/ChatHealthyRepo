[project]
name = "chathealthy-frontend-lib"
version = "0.1.4"
description = "Shared Python code consumed by ChatHealthy.ai's front-end-facing services (FindCare, EvaluateCare, SharedServices). Owned by EPIC-003. Per the auth-token caveat: token MANAGEMENT (verify, parse, advance nonce) lives here; token MANUFACTURE belongs 100% to SharedServices and is intentionally NOT in this package."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "cryptography>=42",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
