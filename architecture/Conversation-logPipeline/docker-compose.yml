# ChatHealthy Kafka — conversation log message queue
# Apache 2.0 licensed. KRaft mode (no ZooKeeper). Single node.
# T004: Kafka in Docker, KRaft mode, 24h retention, single partition.

services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: chathealthy-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft combined mode — single process acts as both broker and controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topic defaults
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 10485760
      KAFKA_LOG_ROLL_HOURS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Memory — keep it small for dev
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Cluster ID for KRaft
      CLUSTER_ID: "ChatHealthyKafkaCluster01"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  kafka-data:
